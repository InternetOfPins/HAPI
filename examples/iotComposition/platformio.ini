; IoT device composition through HAPI: independently-developed OneChip/
; OneBus/OneIO/OneHLS components, glued into one device type per target,
; with the final firmware containing only the behavior actually composed.
; See README.md for what each env demonstrates and the measured numbers.
[platformio]
default_envs = stage1_avr

[common]
build_unflags =
    -std=c++11 -std=c++14
    -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17
; Local source tree, not GitHub -- matches every other example in this
; repo (lib_extra_dirs = ../../..), so in-tree library fixes are actually
; picked up instead of a stale published copy.
lib_extra_dirs = ../../..

[env:stage1_avr]
; Sensor(AHT)+Actuator(PCA9685)+Network(Serial) in one Chain<>, Control
; (oneHLS::Pid) as a plain member, Storage(AT24C) called directly.
platform = atmelavr
board = uno
framework = arduino
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_filter = +<stage1_avr.cpp> -<stage2_esp32.cpp> -<sensorFusion.cpp> -<sensor_api.h> -<stub_sensors.h>
lib_extra_dirs = ${common.lib_extra_dirs}

[env:stage2_esp32]
; Same composition as stage1_avr, Sensor/Actuator/Storage unchanged (only
; the I2C bus type swaps), Network becomes Mqtt<> (include/oneIO/net/mqtt.h).
platform = espressif32
board = esp32dev
framework = arduino
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_filter = +<stage2_esp32.cpp> -<stage1_avr.cpp> -<sensorFusion.cpp> -<sensor_api.h> -<stub_sensors.h>
lib_extra_dirs = ${common.lib_extra_dirs}
lib_deps = knolleary/PubSubClient@^2.8

[env:sensorFusion]
; oneHLS::StaticList<AhtDevice,LightDevice,MotionDevice> -- a typelist of
; heterogeneous, already-composed sensor devices sharing one contract
; (SensorAPI<>), dispatched at compile time via visit(i,fn).
platform = atmelavr
board = uno
framework = arduino
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_filter = +<sensorFusion.cpp> +<sensor_api.h> +<stub_sensors.h> -<stage1_avr.cpp> -<stage2_esp32.cpp>
lib_extra_dirs = ${common.lib_extra_dirs}
