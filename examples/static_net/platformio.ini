; static_net -- static networks: dry, typed, zero-runtime descriptions of dataflow nets. The running example is a
; 4-input classifier (UCI Banknote) on an 8-bit AVR. See README.md.
;
; HAPI resolves locally: this is HAPI's own example, testing the code two directories up. The headers of the
; example itself are in include/ (PlatformIO adds it), the trained cell and its held-out rows in models/banknote/.
;   pio run -e native && .pio/build/native/program        the classifier on the host
;   pio run -e uno -t upload && pio device monitor        the same program on an Arduino Uno / Nano (ATmega328p)
; Everything else (checks, timing, the comparison with emlearn) has its own script: check/build.sh, measure/, compare_emlearn/.
[env]
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++1z
build_flags = -std=gnu++17 -O2 -I$PROJECT_DIR/models/banknote
lib_deps = file://../..

[env:native]
platform = native

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -std=gnu++17 -Os -I$PROJECT_DIR/models/banknote
monitor_speed = 115200
