; ml_interpreter_cost -- the same fully-connected network (TFLM's shipped
; hello_world model) run two ways: as a HAPI Chain<>, and through
; TFLite-Micro's MicroInterpreter. See README.md for the measured numbers.
;
; lib/tflm/ is not in the repo -- run tools/get_tflm.sh first (needs
; git + make + network; NOT TensorFlow). The NetA-vs-TFLM equivalence
; check is check/build.sh (it compiles a TFLM source subset the LDF
; can't scope).
[platformio]
default_envs = netA_bluepill, tflm_float_bluepill

[common]
build_unflags = -std=c++11 -std=c++14 -std=gnu++11 -std=gnu++14 -std=gnu++1z
build_flags =
    -std=gnu++17
    -Os
    -I $PROJECT_DIR/lib/tflm
    -I $PROJECT_DIR/lib/tflm/third_party/flatbuffers/include
    -I $PROJECT_DIR/lib/tflm/third_party/gemmlowp
    -I $PROJECT_DIR/lib/tflm/third_party/ruy
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -fno-rtti -fno-exceptions -fno-threadsafe-statics
lib_extra_dirs = ../../..

; host build of the HAPI net -- a discoverable `pio run` entry point.
[env:host]
platform = native
build_flags = -std=c++17 -O2
lib_extra_dirs = ../../..
build_src_filter = +<netA.cpp> -<tflm.cpp>

; ---------- STM32 bluepill (ARM Cortex-M3) -- gcc 12.3 (7.2 too old for TFLM)
[stm32]
platform = ststm32
board = bluepill_f103c8
framework = cmsis
platform_packages = platformio/toolchain-gccarmnoneeabi@1.120301.0
upload_protocol = stlink
build_unflags = ${common.build_unflags}
lib_extra_dirs = ${common.lib_extra_dirs}

[env:netA_bluepill]
extends = stm32
build_flags = ${common.build_flags}
build_src_filter = +<netA.cpp>

[env:tflm_float_bluepill]
extends = stm32
build_flags = ${common.build_flags}
build_src_filter = +<tflm.cpp>
lib_deps = tflm

[env:tflm_int8_bluepill]
extends = stm32
build_flags = ${common.build_flags} -DTFLM_INT8
build_src_filter = +<tflm.cpp>
lib_deps = tflm

; ---------- ESP32 (Xtensa LX6, framework=arduino) ----------
[esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags = ${common.build_unflags}
lib_extra_dirs = ${common.lib_extra_dirs}
monitor_speed = 115200

[env:netA_esp32]
extends = esp32
build_flags = ${common.build_flags}
build_src_filter = +<netA.cpp>

[env:tflm_float_esp32]
extends = esp32
build_flags = ${common.build_flags}
build_src_filter = +<tflm.cpp>
lib_deps = tflm

[env:tflm_int8_esp32]
extends = esp32
build_flags = ${common.build_flags} -DTFLM_INT8
build_src_filter = +<tflm.cpp>
lib_deps = tflm

; -DHW_READBACK adds a serial print of the result for on-silicon checks
; (the plain envs omit it so the measured object is only the net)
[env:netA_esp32_hw]
extends = esp32
build_flags = ${common.build_flags} -DHW_READBACK
build_src_filter = +<netA.cpp>

[env:tflm_float_esp32_hw]
extends = esp32
build_flags = ${common.build_flags} -DHW_READBACK
build_src_filter = +<tflm.cpp>
lib_deps = tflm
