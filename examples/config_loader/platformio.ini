[platformio]

; HAPI resolves locally (this is HAPI's own example, testing the code
; sitting two directories up, not a re-fetched published copy of itself).
; OneData/OneParse resolve from their real published repos so this example
; builds standalone for anyone who clones only github.com/InternetOfPins/HAPI,
; not only someone with the whole IOP tree checked out locally. OneOutput is
; pulled explicitly too: OneParse's own library.json declares only HAPI as a
; dependency, but oneParse/oneParse.h unconditionally #includes
; <oneOutput/oneOutput.h> -- without this line the GitHub-resolved build
; fails on that missing header.
[env]
build_flags = -std=c++17
lib_deps =
	file://../..
	https://github.com/InternetOfPins/OneData.git
	https://github.com/InternetOfPins/OneParse.git
	https://github.com/InternetOfPins/OneOutput.git

[env:native]
platform = native
debug_build_flags = -O0 -ggdb3 -g3
