[platformio]

[env]
build_flags = -std=c++17
build_unflags=
	-std=c++11
	-std=c++14
	-std=c++20
	-std=c++26
	-std=c++1z
	-std=gnu++11
	-std=gnu++14
	-std=gnu++20
	-std=gnu++26
	-std=gnu++1z
lib_extra_dirs = ../../..

[env:native]
platform = native
debug_build_flags = -O0 -ggdb3 -g3

[env:nano]
board = nanoatmega328
platform = atmelavr
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
lib_deps=
	https://github.com/neu-rah/streamFlow.git

[env:lolin32]
board = lolin32
platform = espressif32
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
; ESP-IDF's portGET_ARGUMENT_COUNT() (portmacro.h) needs the GNU
; ##__VA_ARGS__ extension -- strict -std=c++17 (from [env]) disables
; it and trips a static_assert deep in FreeRTOS's own header; gnu++17
; keeps the extension. Same fix OneMenu/webMenu already uses.
build_flags =
	-std=gnu++17
	-D MENU_DEBUG
	-Wno-switch
