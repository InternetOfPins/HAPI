; A ROS-shaped node — topic pub/sub, a service, an action — composed from
; HAPI primitives, with QoS as decorators. See README.md for what each env
; demonstrates, the measured numbers, and the scope boundary.
[platformio]
default_envs = node_avr

[common]
build_unflags = -std=c++11 -std=c++14 -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -DIOP
; Local source tree, not GitHub — matches every other example here.
lib_extra_dirs = ../../..

[env:node_avr]
; topic (publisher + two local subscribers) + a service + an action,
; one composed Node, loopback transport caps.
platform = atmelavr
board = uno
framework = arduino
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_filter = +<node_avr.cpp> -<qos_decorators.cpp>
lib_extra_dirs = ${common.lib_extra_dirs}

[env:qos_decorators]
; the same /cmd_vel subscriber gains a KEEP_LAST history and a deadline
; watchdog via WithHistory / WithDeadline — no change to the composition.
platform = atmelavr
board = uno
framework = arduino
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_filter = +<qos_decorators.cpp> -<node_avr.cpp>
lib_extra_dirs = ${common.lib_extra_dirs}
