; contractCompose: runtime Design-by-Contract expressed through HAPI's
; existing Chain<>/Part<> axis, not a new orthogonal mechanism. Host-only
; so far -- not yet checked on avr-gcc/arm-none-eabi-gcc/RISC-V/Bambu-
; Vitis front ends. See README.md for what each env demonstrates.
[platformio]
default_envs = strict_broker

[env]
build_flags = -std=c++17
build_unflags =
	-std=c++11
	-std=c++14
	-std=gnu++11
	-std=gnu++14
lib_extra_dirs = ../../..

[env:strict_broker]
platform = native
debug_build_flags = -O0 -ggdb3 -g3
build_src_filter = +<strict_broker.cpp> -<tail_contract.cpp> -<hard_error_demo.cpp>

[env:tail_contract]
platform = native
debug_build_flags = -O0 -ggdb3 -g3
build_src_filter = +<tail_contract.cpp> -<strict_broker.cpp> -<hard_error_demo.cpp>

[env:hard_error]
; Not meant to link -- documents a compile-time property (missing
; contract:: overload for a broker-named method is a hard error).
; `pio run -e hard_error` is EXPECTED to fail.
platform = native
build_src_filter = +<hard_error_demo.cpp> -<strict_broker.cpp> -<tail_contract.cpp>
