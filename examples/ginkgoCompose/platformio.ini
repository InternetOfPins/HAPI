; A concrete look at the apply() dispatch cost from Ginkgo's TOMS-2022
; paper, section 7.2. Each env pair builds the same program two ways --
; Ginkgo's runtime-polymorphic version and a drop-in gko::LinOp whose
; executor/operand types are fixed at compile time. See README.md for
; the objdump comparison, the numbers, and the caveats.
;
; Ginkgo is not a PlatformIO library -- it comes through GINKGO_DIR +
; extra_ginkgo.py. Run ./setup_ginkgo.sh once first.
;
; ./verify.sh reproduces everything (build + objdump + run) with plain
; g++ and does not need PlatformIO.

[platformio]
default_envs = stencil_fixed

[env]
platform = native
build_flags = -std=c++17 -O2
lib_deps =
    file://../..
    https://github.com/InternetOfPins/OneData.git
extra_scripts = pre:extra_ginkgo.py

; ---- custom-matrix-format (StencilMatrix) ----
[env:stencil_baseline]
build_src_filter = +<stencil.cpp> -<advdiff.cpp>

[env:stencil_fixed]
build_src_filter = +<stencil.cpp> -<advdiff.cpp>
build_flags = ${env.build_flags} -DFIXED_EXEC

; ---- advection-diffusion vs gko::Combination ----
[env:advdiff_combination]
build_src_filter = +<advdiff.cpp> -<stencil.cpp>

[env:advdiff_prefold]
build_src_filter = +<advdiff.cpp> -<stencil.cpp>
build_flags = ${env.build_flags} -DPREFOLD

[env:advdiff_hapi]
build_src_filter = +<advdiff.cpp> -<stencil.cpp>
build_flags = ${env.build_flags} -DHAPI
