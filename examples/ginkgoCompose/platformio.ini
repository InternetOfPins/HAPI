; HAPI composition vs. Ginkgo's polymorphic LinOp. Each env pair builds
; the same program two ways -- Ginkgo's own runtime-polymorphic version
; and a drop-in gko::LinOp whose backend/kernel choice is compile-time
; (hapi::Chain + FindFirst). See README.md for the objdump comparison
; (the load-bearing result) and the measured numbers.
;
; Ginkgo is not a PlatformIO library -- it comes through GINKGO_DIR +
; extra_ginkgo.py. Run ./setup_ginkgo.sh once first.
;
; ./verify.sh reproduces everything (build + objdump fork-check + run)
; with plain g++ and does not need PlatformIO.

[platformio]
default_envs = stencil_hapi

[env]
platform = native
build_flags = -std=c++17 -O2
lib_deps =
    file://../..
    https://github.com/InternetOfPins/OneData.git
extra_scripts = pre:extra_ginkgo.py

; ---- Round 2: custom-matrix-format (StencilMatrix) ----
[env:stencil_baseline]
build_src_filter = +<stencil.cpp> -<advdiff.cpp>

[env:stencil_hapi]
build_src_filter = +<stencil.cpp> -<advdiff.cpp>
build_flags = ${env.build_flags} -DHAPI

; ---- Round 3: advection-diffusion vs gko::Combination ----
[env:advdiff_combination]
build_src_filter = +<advdiff.cpp> -<stencil.cpp>

[env:advdiff_prefold]
build_src_filter = +<advdiff.cpp> -<stencil.cpp>
build_flags = ${env.build_flags} -DPREFOLD

[env:advdiff_hapi]
build_src_filter = +<advdiff.cpp> -<stencil.cpp>
build_flags = ${env.build_flags} -DHAPI
