; Orocos KDL's ChainIkSolverPos_NR / _NR_JL: sub-solver types fixed at compile
; time instead of held as ChainFkSolverPos& / ChainIkSolverVel&.
;
; src/kdlCompose.cpp builds, per env, the _Ref form (those abstract-base
; references, == KDL's shipped shape) AND the _T form (concrete template
; parameters), then runs a bit-exact loopback vs KDL's own shipped classes.
; Plain C++ templates -- no HAPI dependency (see README.md).
;
; KDL is not a PlatformIO library -- it comes through KDL_DIR + extra_kdl.py.
; Run ./setup_kdl.sh once first. ./verify.sh reproduces build + objdump + run
; with plain g++ and needs no PlatformIO.

[platformio]
default_envs = pinv

[env]
platform = native
build_flags = -std=c++17 -O2
extra_scripts = pre:extra_kdl.py

[env:pinv]
; sub-solver = ChainIkSolverVel_pinv

[env:wdls]
; sub-solver = ChainIkSolverVel_wdls
build_flags = ${env.build_flags} -DWDLS
