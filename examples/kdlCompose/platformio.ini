; HAPI composition vs. Orocos KDL's runtime IK/FK solver link point.
;
; KDL::ChainIkSolverPos_NR / _NR_JL each hold two abstract-base references
; (ChainFkSolverPos&, ChainIkSolverVel&) and dispatch through both on every
; Newton-Raphson iteration. src/kdlCompose.cpp builds, per env, the Ref baseline
; (those references, == KDL's shipped shape) AND the drop-in Hapi variant whose
; FK + IK-velocity stages are a compile-time hapi::Chain<>, then runs a bit-exact
; loopback vs KDL's own shipped classes.
;
; KDL is not a PlatformIO library -- it comes through KDL_DIR + extra_kdl.py.
; Run ./setup_kdl.sh once first. ./verify.sh reproduces build + objdump + run
; with plain g++ and needs no PlatformIO.

[platformio]
default_envs = pinv

[env]
platform = native
build_flags = -std=c++17 -O2
lib_deps =
    file://../..
extra_scripts = pre:extra_kdl.py

[env:pinv]
; ChainIkSolverVel_pinv  vs  IkSolverPos_NR_Hapi<PseudoInverse>

[env:wdls]
; ChainIkSolverVel_wdls  vs  IkSolverPos_NR_Hapi<DampedLeastSquares>
build_flags = ${env.build_flags} -DWDLS
