[platformio]

; HAPI resolves locally (this is HAPI's own example, testing the code
; sitting two directories up). OneData resolves from its real published
; repo so this example builds standalone for anyone who clones only
; github.com/InternetOfPins/HAPI. See extra_cutlass.py for the two
; additional env-var-gated include paths this example needs (real NVIDIA
; CUTLASS/CuTe + a minimal set of NVIDIA's own header-only pip packages --
; neither is a PlatformIO-packaged library, so neither belongs in lib_deps).
[env]
build_flags = -std=c++17
lib_deps =
	file://../..
	https://github.com/InternetOfPins/OneData.git
extra_scripts = pre:extra_cutlass.py

[env:native]
platform = native
debug_build_flags = -O0 -ggdb3 -g3
