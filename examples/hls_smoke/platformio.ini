[platformio]

[env:native]
platform = native
build_flags = -std=c++17
debug_build_flags = -O0 -ggdb3 -g3
lib_extra_dirs = ../../..
extra_scripts = pre:extra_hls.py

[env:hls]
; Not a real PlatformIO build target -- Bambu synthesizes RTL, not a
; linked executable, so there is nothing for PlatformIO's own toolchain
; to build here. This env exists only so `pio run -e hls -t <target>`
; is a valid, discoverable entry point; the actual work happens in
; extra_hls.py's custom target (synthesize-wrapsum).
platform = native
build_flags = -std=c++17
lib_extra_dirs = ../../..
extra_scripts = pre:extra_hls.py

[env:hls-vitis]
; Second, independent HLS backend for the same source -- AMD/Xilinx's own
; Vitis HLS instead of Bambu. See README.md's Cross-tool/cross-config
; validation section. Requires VITIS_HLS; see extra_hls_vitis.py.
platform = native
build_flags = -std=c++17
lib_extra_dirs = ../../..
extra_scripts = pre:extra_hls_vitis.py

[env:hls-intel]
; Third, independent HLS backend for the same source -- Intel HLS
; Compiler instead of Bambu, DIFFERENT DEVICE FAMILY (Altera/Intel, not
; Xilinx). See README.md's Cross-tool/cross-config validation section.
; Requires i++ on PATH; see extra_hls_intel.py.
platform = native
build_flags = -std=c++17
lib_extra_dirs = ../../..
extra_scripts = pre:extra_hls_intel.py
