name: Smoke build (reusable)

# Native g++ compile+run of test/tests for one InternetOfPins repo, called
# by each repo's own .github/workflows/ci.yml. Cross-toolchain (AVR/STM32/
# Bambu/Vitis) coverage is out of scope for this pass.

on:
  workflow_call:
    inputs:
      repo:
        description: "Repo name under github.com/InternetOfPins (e.g. OneParse)"
        required: true
        type: string

jobs:
  smoke-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.repo }}
        uses: actions/checkout@v4
        with:
          path: ${{ inputs.repo }}

      # Resolves library.json's "dependencies" transitively by cloning each
      # named sibling repo's default branch — a deliberate simplification,
      # not a real semver/URL-pin resolver (library.json mixes "*", ">=x",
      # and bare git URLs across repos).
      - name: Resolve sibling dependencies
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          org = "https://github.com/InternetOfPins"
          root = "${{ inputs.repo }}"
          seen = {root}
          queue = [root]

          def deps_of(name):
              path = os.path.join(name, "library.json")
              if not os.path.isfile(path):
                  return []
              with open(path) as f:
                  data = json.load(f)
              return list(data.get("dependencies", {}).keys())

          while queue:
              name = queue.pop(0)
              for dep in deps_of(name):
                  if dep in seen:
                      continue
                  seen.add(dep)
                  subprocess.run(
                      ["git", "clone", "--depth", "1", f"{org}/{dep}.git", dep],
                      check=True,
                  )
                  queue.append(dep)

          with open("include_dirs.txt", "w") as f:
              for name in sorted(seen):
                  inc = os.path.join(name, "include")
                  if os.path.isdir(inc):
                      f.write(inc + "\n")
          PY

      # OneHLS needs the real Siemens/Mentor ac_types and Xilinx ap_types
      # vendor headers, which aren't InternetOfPins repos.
      - name: Fetch ac_types/ap_types
        if: inputs.repo == 'OneHLS'
        run: |
          git clone --depth 1 https://github.com/hlslibs/ac_types.git ac_types
          git clone --depth 1 https://github.com/Xilinx/HLS_arbitrary_Precision_Types.git ap_types
          echo "ac_types/include" >> include_dirs.txt
          echo "ap_types/include" >> include_dirs.txt

      - name: Compile and run tests
        run: |
          shopt -s nullglob
          INC=$(sed 's/^/-I /' include_dirs.txt | tr '\n' ' ')
          repo="${{ inputs.repo }}"
          files=("$repo"/test/*.cpp "$repo"/tests/*.cpp)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no test files found under $repo/test or $repo/tests"
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            echo "=== $f ==="
            bin="/tmp/$(basename "$f" .cpp)"
            if g++ -std=c++17 -Wall -Wextra -Wpedantic $INC "$f" -o "$bin"; then
              "$bin" || { echo "FAILED (runtime): $f"; status=1; }
            else
              echo "FAILED (compile): $f"; status=1
            fi
          done
          exit $status

  # MSVC (cl.exe) coverage, trialed on HAPI alone first (zero-dependency
  # case) before promotion here. Dependency resolution and test discovery
  # are reimplemented natively in PowerShell rather than reusing the
  # bash/python3 steps above -- windows-latest's default per-step shell is
  # pwsh, and python3 (vs. plain python) isn't guaranteed reachable there.
  msvc-smoke-build:
    runs-on: windows-latest
    steps:
      - name: Checkout ${{ inputs.repo }}
        uses: actions/checkout@v4
        with:
          path: ${{ inputs.repo }}

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Resolve sibling dependencies
        run: |
          $org = "https://github.com/InternetOfPins"
          $root = "${{ inputs.repo }}"
          $seen = [System.Collections.Generic.HashSet[string]]::new()
          [void]$seen.Add($root)
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue($root)

          function Get-Deps($name) {
            $path = Join-Path $name "library.json"
            if (-not (Test-Path $path)) { return @() }
            $data = Get-Content $path -Raw | ConvertFrom-Json
            if ($data.dependencies) { return @($data.dependencies.PSObject.Properties.Name) }
            return @()
          }

          while ($queue.Count -gt 0) {
            $name = $queue.Dequeue()
            foreach ($dep in (Get-Deps $name)) {
              if ($seen.Contains($dep)) { continue }
              [void]$seen.Add($dep)
              git clone --depth 1 "$org/$dep.git" $dep
              if ($LASTEXITCODE -ne 0) { exit 1 }
              $queue.Enqueue($dep)
            }
          }

          $incDirs = @()
          foreach ($name in ($seen | Sort-Object)) {
            $inc = Join-Path $name "include"
            if (Test-Path $inc) { $incDirs += $inc }
          }
          $incDirs | Set-Content include_dirs.txt

      # Mirrors the Linux job's OneHLS special-case above: real Siemens/
      # Xilinx vendor headers, not InternetOfPins repos.
      - name: Fetch ac_types/ap_types
        if: inputs.repo == 'OneHLS'
        run: |
          git clone --depth 1 https://github.com/hlslibs/ac_types.git ac_types
          git clone --depth 1 https://github.com/Xilinx/HLS_arbitrary_Precision_Types.git ap_types
          Add-Content include_dirs.txt "ac_types/include"
          Add-Content include_dirs.txt "ap_types/include"

      - name: Compile and run tests (cl.exe)
        run: |
          $status = 0
          $incArgs = @()
          if (Test-Path include_dirs.txt) {
            $incArgs = Get-Content include_dirs.txt | Where-Object { $_.Trim() -ne "" } | ForEach-Object { "/I$_" }
          }

          $repo = "${{ inputs.repo }}"
          $files = @(Get-ChildItem -Path "$repo/test","$repo/tests" -Filter *.cpp -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            Write-Host "no test files found under $repo/test or $repo/tests"
            exit 0
          }
          foreach ($f in $files) {
            Write-Host "=== $($f.FullName) ==="
            cl /std:c++17 /W4 /EHsc /nologo @incArgs $f.FullName /Fe:smoke.exe
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED (compile): $($f.Name)"
              $status = 1
              continue
            }
            .\smoke.exe
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED (runtime): $($f.Name)"
              $status = 1
            }
          }
          exit $status
